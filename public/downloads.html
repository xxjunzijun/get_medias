<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>已下载内容 - Get Videos</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace library-workspace">
        <div class="masthead library-masthead">
          <div class="top-nav">
            <p class="eyebrow">Media Library</p>
            <a class="nav-link" href="/">返回下载器</a>
          </div>
          <h1>已下载内容</h1>
        </div>

        <section class="library-toolbar">
          <div>
            <p class="muted">按下载任务分组</p>
            <h2 id="librarySummary">正在读取 downloads 目录</h2>
          </div>
          <button id="refreshDownloads" type="button" class="ghost-button">刷新</button>
        </section>

        <div id="downloadsList" class="task-library"></div>
      </section>
    </main>

    <div id="lightbox" class="lightbox" hidden>
      <button id="closeLightbox" class="lightbox-close" type="button">关闭</button>
      <button id="prevLightbox" class="lightbox-nav lightbox-prev" type="button">上一张</button>
      <figure class="lightbox-stage">
        <img id="lightboxImage" alt="">
        <figcaption id="lightboxCaption"></figcaption>
      </figure>
      <button id="nextLightbox" class="lightbox-nav lightbox-next" type="button">下一张</button>
    </div>

    <script type="module" src="/downloads.js"></script>
  </body>
</html>
